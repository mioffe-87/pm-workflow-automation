kind: pipeline
type: kubernetes
name: drone-runner

steps:

  - name: CheckMarx Scan
    image: itc-docker-dev-local.artifactory.paloaltonetworks.com/circleci-gcp-base-image:latest
    environment:
      BD_TOKEN:
        from_secret: bd_token
      BD_GCP_KEY:
        from_secret: bd_gcp_key
      cx_password:
        from_secret: Cx_Password
    commands:
    - yum install -y which
    - "curl -o runcx.sh --silent -X GET -H \"Authorization: Bearer $(echo '' | base64 -d | bash)\" \"https://storage.googleapis.com/storage/v1/b/secure-cicd-scripts/o/runcx.sh?alt=media\""
    - bash runcx.sh --cx-project="CxServer\\\\SP\\\\Company\\\\IT\\\\${DRONE_REPO_NAME}" --user="svc-it" --password="$cx_password" --path-exclude="Test,*test*,QA" --file-exclude="*.yml,*.yaml,*test*"

image_pull_secrets:
  - art-com-secrt

trigger:
  branch:
    - master

  ref:
    exclude:
      - refs/tags/**
