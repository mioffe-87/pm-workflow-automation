<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">

<html>
<head>
	<title>LLBLGen Pro quick start guide: Open a project</title>
	<link rel="STYLESHEET" type="text/css" href="stylesheets/general.css">
	<script src="script.js" type="text/javascript"></script>
	<script type="text/javascript">
	function toggle()
	{
		var workType=getCookie("qsg_workType");
		switch(workType)
		{
			case 'DF':
				hideDiv("NS_MF");
				break;
			case 'MF1':
			case 'MF2':
				hideDiv("NS_DF");
				break;
		}
	}
	</script>
</head>
<body>
<table width="95%" cellpadding="0" cellspacing="5">
	<tr>
		<td>
			<H1>Open a project&nbsp;&nbsp;<img src="pics/openHS.png" width="16" height="16" alt="open a project" border="0"></H1>
		</td>
		<td align="right" nowrap>
			<br>
			<a href="javascript:history.go(-1)" class="nohover"><img src="pics/back.gif" width="30" height="23" border="0" alt="back"></a>&nbsp;&nbsp;
			<a href="index.htm" title="home" class="nohover"><img src="pics/home.gif" width="30" height="23" alt="home" border="0"></a>
		</td>
	</tr>
</table>
<br clear="all"><br>
<table width="95%" cellpadding="0" cellspacing="5">
	<tr>
		<td width="40" valign="top">
			<img src="pics/1.png" width="30" height="30" alt="1." border="0">
		</td>
		<td class="content">
			Click the <i>Open LLBLGen Pro Project...</i> button on the toolbar.<br><br>
			<img src="pics/openproject1.png" width="277" height="135" alt="Open project" border="0" align="left">
			<br><br><br>
		</td>
	</tr>
	<tr>
		<td valign="top">
			<img src="pics/2.png" width="30" height="30" alt="2." border="0">
		</td>
		<td class="content">
			Browse to your project and double click on the project name. By default, LLBLGen Pro saves its projects in <i>My documents/LLBLGen Pro Projects.</i><br>
			<img src="pics/openproject2.png" width="685" height="482" alt="open a project" border="0">
		</td>
	</tr>
	<tr>
		<td colspan="2" height="10" style="background-image: url(pics/hline.png); background-repeat: no-repeat;">&nbsp;</td>
	</tr>
</table>
<br clear="all">
<table cellpadding="0" cellspacing="0">
	<tr>
		<td>
			<img src="pics/nextstep.png" width="257" height="20" alt="next step" border="0">
		</td>
	</tr>
</table>
<div id="NS_DF">	
<table cellpadding="0" cellspacing="0">
	<tr>
		<td width="90">&nbsp;</td>
		<td class="content">
			<a href="df_refresh.htm">Refresh relational model data</a>
		</td>
	</tr>
</table>
</div>
<div id="NS_MF">
<table cellpadding="0" cellspacing="0">
	<tr>
		<td width="90">&nbsp;</td>
		<td class="content">
			<a href="mf_editentities.htm">Edit entity model</a>
		</td>
	</tr>
</table>
</div>
<br><br>
<script type="text/javascript">toggle();</script>
</body>
</html>
